# Synthetic browser-login fixture only; no development identity storage or secrets.
name: datalens-agent-auth-tests
services:
  identity-test-keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_HOSTNAME: http://localhost:18081
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./tests/fixtures/login-realm.json:/opt/keycloak/data/import/browser-test-realm.json:ro
      - ./tests/fixtures/refresh-realm.json:/opt/keycloak/data/import/refresh-test-realm.json:ro
    tmpfs:
      - /opt/keycloak/data:uid=1000,gid=0,mode=0770
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 40
    mem_limit: 768m
