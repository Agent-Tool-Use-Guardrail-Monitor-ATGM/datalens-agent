name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      agent-test-postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: agent_test_db
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://agent_test:test-only-password@127.0.0.1:5432/agent_test_db
      AUTH_BROWSER_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --editable .

      - name: Prepare browser and disposable Keycloak
        run: |
          python -m playwright install --with-deps chromium
          docker compose -p datalens-agent-auth-tests -f compose.auth.test.yaml up -d --wait --wait-timeout 240

      - name: Run tests
        run: python -m pytest -q

      - name: Remove disposable identity fixture
        if: always()
        run: docker compose -p datalens-agent-auth-tests -f compose.auth.test.yaml down
